    <!-- Tilbud er ikke noget der skal kunne findes i en søgemaskine. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Samme ikon som i planlægningsappen og Worklist. Portalen stod med
         browserens grå klode, og en kunde, der har fanen åben ved siden af sin
         bank og sin mail, skal kunne se hvilken den er.
         apple-touch-icon er med, fordi en kunde kan lægge linket på
         hjemmeskærmen på sin iPhone; uden den tager iOS et gråt skærmbillede
         af siden i stedet. Ingen manifest-fil: portalen er en almindelig side
         og skal ikke installeres som app. -->
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />

    <title>Jammerbugt Rengøring</title>
  </head>
