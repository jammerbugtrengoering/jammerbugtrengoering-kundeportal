<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <!-- Tilbud er ikke noget der skal kunne findes i en søgemaskine. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Portalen stod med browserens grå klode. En kunde, der har fanen åben ved
         siden af sin bank og sin mail, skal kunne se hvilken den er.

         Eget ikon og ikke app-icon.png fra de to andre apps: dér står damen ved
         siden af et ur, og uret betyder tidsregistrering. Det er kontorets og
         medarbejdernes sag og siger en kunde ingenting. Derfor kun figuren, og
         centreret — der var et tomt felt tilbage, hvor uret stod, og ved 16 px i
         en fane er det den slags, der afgør, om man kan se hvad ikonet er.

         apple-touch-icon er med, fordi en kunde kan lægge linket på hjemmeskærmen
         på sin iPhone; uden den tager iOS et gråt skærmbillede af siden i stedet.
         Ingen manifest-fil: portalen er en almindelig side og skal ikke
         installeres som app. -->
    <link rel="icon" type="image/png" href="/portal-icon.png" />
    <link rel="apple-touch-icon" href="/portal-icon.png" />

    <title>Jammerbugt Rengøring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
